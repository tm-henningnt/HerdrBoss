<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Review packs mockup</title>
<style>
/* Incumbent Herdr Boss tokens, copied from public/style.css. The mockup adds no new colors. */
:root {
  --bg: #f4f2ee; --panel: #ffffff; --panel-2: #f8f6f2; --line: #e3dfd7; --text: #1d1b18; --muted: #6f6a61; --faint: #a19b90;
  --accent: #d0621f; --ok: #2f8a4c; --warn: #b7791f; --crit: #c2362b; --info: #3a6ea5;
  --mono: ui-monospace, "SF Mono", "JetBrains Mono", Menlo, monospace;
  --sans: -apple-system, BlinkMacSystemFont, "Inter", "Segoe UI", sans-serif;
  --select: color-mix(in srgb, var(--accent) 12%, var(--panel-2));
  --bar-h: 52px; --on-accent: #fff;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #121110; --panel: #1b1a18; --panel-2: #22201d; --line: #2e2b27; --text: #ece8e1; --muted: #a39d92; --faint: #6c665d;
    --accent: #ef8a4a; --ok: #5cbf7a; --warn: #e0a84a; --crit: #ef6a5e; --info: #74a6dd; --on-accent: #1d1b18; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #121110; --panel: #1b1a18; --panel-2: #22201d; --line: #2e2b27; --text: #ece8e1; --muted: #a39d92; --faint: #6c665d;
  --accent: #ef8a4a; --ok: #5cbf7a; --warn: #e0a84a; --crit: #ef6a5e; --info: #74a6dd; --on-accent: #1d1b18; color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body { background: var(--bg); color: var(--text); font: 14px/1.45 var(--sans); -webkit-font-smoothing: antialiased; }
::selection { background: color-mix(in srgb, var(--accent) 30%, transparent); }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
textarea, input { caret-color: var(--accent); font: inherit; color: inherit; }
* { scrollbar-width: thin; scrollbar-color: var(--line) transparent; }
button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; }
a { color: inherit; text-underline-offset: 3px; }
.icon { width: 22px; height: 22px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; flex: 0 0 auto; }
.icon-sm { width: 16px; height: 16px; }
.num { font-family: var(--mono); font-variant-numeric: tabular-nums; }
.vh { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }

/* ---------- The board around the screens ---------- */
.board-head { display: flex; flex-wrap: wrap; align-items: center; gap: 12px 20px; padding: 18px max(16px, env(safe-area-inset-left)) 12px; border-bottom: 1px solid var(--line); }
.board-head h1 { margin: 0; font-size: 18px; font-weight: 650; letter-spacing: -0.01em; }
.board-head p { margin: 0; color: var(--muted); font-size: 13px; max-width: 70ch; }
.seg { display: inline-flex; padding: 2px; border: 1px solid var(--line); border-radius: 8px; background: var(--panel-2); }
.seg button, .seg a { padding: 4px 10px; border-radius: 6px; font-size: 12.5px; color: var(--muted); text-decoration: none; }
.seg [aria-pressed="true"], .seg [aria-current] { background: var(--panel); color: var(--text); font-weight: 600; box-shadow: 0 1px 2px rgb(0 0 0 / 0.08); }
.board-head .seg { margin-left: auto; }
.board { display: flex; flex-wrap: wrap; gap: 28px 24px; padding: 20px 16px 40px; }
.screen-label { display: flex; align-items: baseline; gap: 8px; margin: 0 0 8px; font-size: 13px; font-weight: 650; }
.screen-label small { color: var(--muted); font-weight: 400; }

/* A phone screen is 390 by 760. At 760 px and less it takes the full width. */
.phone { width: 390px; height: 760px; display: flex; flex-direction: column; overflow: hidden; position: relative; background: var(--bg); border: 1px solid var(--line); border-radius: 22px; box-shadow: 0 10px 30px -12px rgb(0 0 0 / 0.25); }
@media (max-width: 760px) {
  .board { padding: 12px 0 32px; gap: 28px; }
  .board > figure { width: 100%; }
  .screen-label { padding: 0 16px; }
  .phone { width: 100%; border-radius: 0; border-left: 0; border-right: 0; box-shadow: none; }
}
figure { margin: 0; }

/* ---------- App bar, as in the M1 app view ---------- */
.bar { flex: 0 0 auto; display: flex; align-items: center; gap: 2px; min-height: var(--bar-h); padding: 0 6px; background: var(--panel); border-bottom: 1px solid var(--line); }
.bar h2 { flex: 1 1 auto; min-width: 0; margin: 0 4px; font-size: 16px; font-weight: 650; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.bar h2 small { display: block; color: var(--muted); font-size: 12px; font-weight: 450; }
.ibtn { position: relative; display: grid; place-items: center; width: 44px; height: 44px; border-radius: 50%; }
.ibtn:hover { background: var(--panel-2); }
.scroll { flex: 1 1 auto; min-height: 0; overflow: auto; }
.tabs { display: flex; gap: 4px; padding: 8px 12px; background: var(--panel); border-bottom: 1px solid var(--line); }
.tabs button { padding: 5px 12px; border-radius: 999px; font-size: 13px; color: var(--muted); }
.tabs button[aria-pressed="true"] { background: var(--select); color: var(--text); font-weight: 600; }

/* ---------- State chips. Each chip has an icon and a word, never color alone. ---------- */
.chip { display: inline-flex; align-items: center; gap: 4px; height: 22px; padding: 0 8px; border-radius: 999px; font-size: 11.5px; font-weight: 600; white-space: nowrap; border: 1px solid transparent; }
.chip .icon { width: 13px; height: 13px; stroke-width: 2.2; }
.chip.ok { color: var(--ok); background: color-mix(in srgb, var(--ok) 12%, transparent); }
.chip.crit { color: var(--crit); background: color-mix(in srgb, var(--crit) 12%, transparent); }
.chip.warn { color: var(--warn); background: color-mix(in srgb, var(--warn) 14%, transparent); }
.chip.info { color: var(--info); background: color-mix(in srgb, var(--info) 12%, transparent); }
.chip.open { color: var(--muted); border-color: var(--line); }
.chip.changed { color: var(--accent); border-color: color-mix(in srgb, var(--accent) 45%, transparent); }

/* ---------- The progress bar (dataviz: fixed order, 2 px gaps, hatch on Denied) ---------- */
.prog { display: flex; gap: 2px; height: 10px; border-radius: 5px; overflow: hidden; background: var(--panel); }
.prog i { display: block; height: 100%; min-width: 3px; }
.prog i:first-child { border-radius: 4px 0 0 4px; } .prog i:last-child { border-radius: 0 4px 4px 0; }
.s-ok { background: var(--ok); } .s-info { background: var(--info); } .s-warn { background: var(--warn); }
.s-crit { background: repeating-linear-gradient(135deg, var(--crit) 0 3px, color-mix(in srgb, var(--crit) 55%, var(--panel)) 3px 5px); }
.s-open { background: var(--line); }
.legend { display: flex; flex-wrap: wrap; gap: 4px 12px; margin-top: 8px; font-size: 12px; color: var(--muted); }
.legend span { display: inline-flex; align-items: center; gap: 5px; }
.legend i { width: 10px; height: 10px; border-radius: 3px; }
.legend b { color: var(--text); font-weight: 600; font-family: var(--mono); font-size: 11.5px; }

/* ---------- Pack list ---------- */
.row { display: grid; grid-template-columns: 40px 1fr auto; gap: 4px 12px; align-items: center; padding: 12px 14px; border-bottom: 1px solid var(--line); background: var(--panel); text-decoration: none; }
.row:hover { background: var(--panel-2); }
.av { width: 40px; height: 40px; border-radius: 50%; display: grid; place-items: center; font-weight: 700; font-size: 14px; color: #fff; grid-row: span 2; }
.av.a1 { background: #5b6f8f; } .av.a2 { background: #5a7447; } .av.a3 { background: #8f6a5b; }
.row strong { font-size: 14.5px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.row .meta { color: var(--muted); font-size: 12px; white-space: nowrap; }
.row .line2 { grid-column: 2 / 4; display: flex; align-items: center; gap: 10px; }
.row .line2 .prog { flex: 1 1 auto; height: 6px; }
.row .line2 .num { font-size: 12px; color: var(--muted); }
.row.unread strong::after { content: ""; display: inline-block; width: 8px; height: 8px; margin-left: 8px; border-radius: 50%; background: var(--accent); vertical-align: 2px; }
.group-h { padding: 14px 14px 6px; font-size: 12px; font-weight: 650; color: var(--muted); }

/* ---------- Section list ---------- */
.pack-head { padding: 12px 14px 12px; background: var(--panel); border-bottom: 1px solid var(--line); }
.pack-head .top { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 8px; font-size: 12.5px; color: var(--muted); }
.pack-head .top b { color: var(--text); font-family: var(--mono); font-weight: 600; }
.sec { margin-top: 10px; background: var(--panel); border-top: 1px solid var(--line); border-bottom: 1px solid var(--line); }
.sec-h { display: flex; align-items: center; gap: 8px; padding: 10px 14px 8px; }
.sec-h h3 { flex: 1 1 auto; margin: 0; font-size: 14px; font-weight: 650; }
.sec-h .num { color: var(--muted); font-size: 12px; }
.it { display: grid; grid-template-columns: 52px 1fr auto 28px; gap: 10px; align-items: center; min-height: 56px; padding: 6px 14px; border-top: 1px solid var(--line); }
.it.done { min-height: 40px; grid-template-columns: 22px 1fr auto 28px; }
.it.done .thumb { width: 22px; height: 22px; border-radius: 5px; }
.it.done .t { color: var(--muted); }
.thumb { width: 52px; height: 38px; border-radius: 6px; border: 1px solid var(--line); overflow: hidden; background: var(--panel-2); display: grid; place-items: center; color: var(--muted); }
.thumb .icon { width: 18px; height: 18px; }
.it .t { min-width: 0; font-size: 13.5px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.it .t small { display: block; color: var(--muted); font-size: 11.5px; }
.viewed { width: 20px; height: 20px; border-radius: 5px; border: 1.6px solid var(--faint); display: grid; place-items: center; justify-self: end; }
.viewed.on { background: var(--muted); border-color: var(--muted); color: var(--panel); }
.viewed .icon { width: 13px; height: 13px; stroke-width: 3; }
.sticky-foot { flex: 0 0 auto; display: flex; align-items: center; gap: 10px; padding: 10px 14px calc(10px + env(safe-area-inset-bottom)); background: var(--panel); border-top: 1px solid var(--line); }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; height: 40px; padding: 0 16px; border-radius: 10px; font-weight: 600; font-size: 14px; border: 1px solid var(--line); background: var(--panel); text-decoration: none; }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
.btn.grow { flex: 1 1 auto; }
.sticky-foot .muted { color: var(--muted); font-size: 12.5px; }

/* ---------- Item viewer ---------- */
.viewer { flex: 1 1 auto; min-height: 0; position: relative; display: flex; flex-direction: column; background: color-mix(in srgb, var(--bg) 70%, #000 0%); }
.pairbar { position: absolute; top: 10px; left: 50%; transform: translateX(-50%); z-index: 3; }
.pairbar .seg { background: color-mix(in srgb, var(--panel) 88%, transparent); backdrop-filter: blur(8px); box-shadow: 0 2px 8px rgb(0 0 0 / 0.12); }
.stage { flex: 1 1 auto; min-height: 0; overflow: hidden; display: grid; place-items: center; padding: 56px 10px 10px; position: relative; }
.hint { position: absolute; left: 50%; bottom: 14px; transform: translateX(-50%); z-index: 3; display: inline-flex; align-items: center; gap: 8px; padding: 7px 12px; border-radius: 999px; background: rgb(20 18 16 / 0.82); color: #f4f2ee; font-size: 12.5px; white-space: nowrap; }
.hint .icon { width: 16px; height: 16px; }
.zoomchip { position: absolute; right: 12px; top: 12px; z-index: 3; padding: 3px 8px; border-radius: 6px; background: rgb(20 18 16 / 0.72); color: #f4f2ee; font: 600 11.5px var(--mono); }
.item-body { flex: 0 0 auto; padding: 10px 14px; background: var(--panel); border-top: 1px solid var(--line); font-size: 13px; }
.item-body p { margin: 0; color: var(--muted); }
.item-body .note { margin-top: 8px; display: flex; gap: 8px; align-items: flex-start; padding: 8px 10px; border-radius: 8px; background: var(--panel-2); border: 1px solid var(--line); color: var(--text); }
.pin { width: 24px; height: 24px; border-radius: 50%; display: grid; place-items: center; background: var(--accent); color: var(--on-accent); font: 700 12px var(--sans); box-shadow: 0 0 0 2px var(--panel), 0 3px 8px rgb(0 0 0 / 0.3); flex: 0 0 auto; }
.saved { margin-left: auto; color: var(--muted); font-size: 11.5px; white-space: nowrap; display: inline-flex; align-items: center; gap: 4px; }
.answer { flex: 0 0 auto; display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; padding: 8px 10px calc(8px + env(safe-area-inset-bottom)); background: var(--panel); border-top: 1px solid var(--line); }
.answer button { display: grid; justify-items: center; gap: 2px; padding: 6px 0 5px; border-radius: 10px; font-size: 11.5px; font-weight: 600; color: var(--muted); }
.answer button:hover { background: var(--panel-2); }
.answer button .icon { width: 22px; height: 22px; }
.answer .on-crit { color: var(--crit); background: color-mix(in srgb, var(--crit) 12%, transparent); }
.answer .on-ok { color: var(--ok); background: color-mix(in srgb, var(--ok) 12%, transparent); }
.answer .on-info { color: var(--info); background: color-mix(in srgb, var(--info) 12%, transparent); }
.answer.choice { grid-template-columns: 1fr 1fr 0.8fr; }
.answer.choice button { display: flex; align-items: center; justify-content: center; gap: 6px; min-height: 44px; font-size: 13px; padding: 0 6px; border: 1px solid var(--line); }
.answer.choice button .icon { width: 16px; height: 16px; }
.answer.choice .picked { border-color: var(--accent); color: var(--accent); background: var(--select); }

/* ---------- Invented screenshots, drawn in CSS ---------- */
.shot { position: relative; width: 100%; max-width: 360px; aspect-ratio: 9 / 16; border-radius: 10px; overflow: hidden; box-shadow: 0 6px 20px -6px rgb(0 0 0 / 0.35); font-family: Georgia, "Times New Roman", serif; }
.shot.lp-dark { background: #16181d; color: #d7dae0; }
.shot.lp-light { background: #fbfaf7; color: #1b1d22; }
.lp-nav { display: flex; justify-content: space-between; align-items: center; padding: 14px 16px; font: 600 11px var(--sans); }
.lp-nav i { display: inline-block; width: 28px; height: 6px; margin-left: 8px; border-radius: 3px; background: currentColor; opacity: 0.35; }
.lp-hero { padding: 28px 18px 0; }
.lp-hero .h { font-size: 30px; line-height: 1.05; letter-spacing: -0.02em; }
.shot.lp-dark .lp-hero .h { color: #6c7079; }
.lp-hero .p { margin-top: 12px; font: 13px/1.5 var(--sans); opacity: 0.7; }
.lp-cta { display: inline-block; margin-top: 18px; padding: 10px 16px; border-radius: 8px; background: #3f6fd8; color: #fff; font: 600 12px var(--sans); }
.lp-img { margin: 22px 18px 0; height: 150px; border-radius: 10px; background: linear-gradient(135deg, #3f6fd8, #8a6fd8 55%, #d88a6f); }
.shot.lp-dark .lp-img { filter: saturate(0.8) brightness(0.8); }
.lp-cards { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin: 14px 18px; }
.lp-cards i { height: 60px; border-radius: 8px; background: currentColor; opacity: 0.08; }
.shot .pin { position: absolute; }
.focus-ring { position: absolute; border: 2px dashed var(--accent); border-radius: 6px; }

/* Code, diff, and tables */
.doc { padding: 14px; font-size: 13px; background: var(--panel); }
.doc h4 { margin: 0 0 6px; font-size: 15px; }
.doc p { margin: 0 0 10px; color: var(--muted); }
.code { font: 12px/1.6 var(--mono); border: 1px solid var(--line); border-radius: 8px; overflow: auto; background: var(--panel-2); }
.code div { display: grid; grid-template-columns: 34px 16px 1fr; white-space: pre; padding-right: 10px; }
.code .ln { color: var(--faint); text-align: right; padding-right: 8px; }
.code .add { background: color-mix(in srgb, var(--ok) 13%, transparent); }
.code .del { background: color-mix(in srgb, var(--crit) 12%, transparent); }
.code .hl { outline: 2px solid color-mix(in srgb, var(--accent) 60%, transparent); outline-offset: -2px; }
.code .hunk { color: var(--info); background: color-mix(in srgb, var(--info) 8%, transparent); }
table.t { width: 100%; border-collapse: collapse; font-size: 12.5px; }
table.t th, table.t td { text-align: left; padding: 7px 10px; border-bottom: 1px solid var(--line); vertical-align: top; }
table.t th { position: sticky; top: 0; background: var(--panel-2); font-size: 11.5px; color: var(--muted); font-weight: 650; }
table.t code { font: 11.5px var(--mono); }
table.t tr.hl td { background: color-mix(in srgb, var(--accent) 14%, transparent); box-shadow: inset 0 -1px 0 color-mix(in srgb, var(--accent) 50%, transparent); }
.inline-note { display: flex; align-items: flex-start; gap: 8px; margin: 8px 0 0; padding: 8px 10px; border: 1px solid color-mix(in srgb, var(--accent) 40%, var(--line)); border-radius: 8px; background: var(--select); font-size: 12.5px; }
.inline-note .pin { width: 20px; height: 20px; font-size: 11px; }
.inline-note textarea { flex: 1 1 auto; min-height: 44px; border: 0; background: transparent; resize: none; padding: 0; }

/* Summary */
.sumsec { background: var(--panel); border-top: 1px solid var(--line); border-bottom: 1px solid var(--line); margin-top: 10px; }
.sumsec h3 { display: flex; align-items: center; gap: 8px; margin: 0; padding: 10px 14px 6px; font-size: 13.5px; }
.sumsec h3 .num { color: var(--muted); font-weight: 500; font-size: 12px; margin-left: auto; }
.sumsec li { list-style: none; padding: 7px 14px; border-top: 1px solid var(--line); font-size: 13px; }
.sumsec ul { margin: 0; padding: 0; }
.sumsec li small { display: block; color: var(--muted); font-size: 12px; }
.sumsec li .go { float: right; color: var(--accent); font-weight: 600; font-size: 12.5px; text-decoration: none; }
.verdict { display: grid; gap: 6px; padding: 10px 14px; }
.verdict label { display: flex; align-items: center; gap: 10px; padding: 9px 12px; border: 1px solid var(--line); border-radius: 10px; background: var(--panel); font-size: 13.5px; }
.verdict label.sel { border-color: var(--accent); background: var(--select); font-weight: 600; }
.verdict label small { margin-left: auto; color: var(--muted); font-size: 11.5px; font-weight: 450; }
.radio { width: 16px; height: 16px; border-radius: 50%; border: 1.6px solid var(--faint); }
.sel .radio { border: 5px solid var(--accent); }
.packnote { margin: 0 14px; padding: 10px 12px; border: 1px solid var(--line); border-radius: 10px; background: var(--panel); min-height: 64px; font-size: 13.5px; }
.packnote .saved { float: right; }
.stat-line { display: flex; justify-content: space-between; font-size: 12.5px; color: var(--muted); margin-bottom: 8px; }
.stat-line b { font: 600 20px var(--sans); color: var(--text); letter-spacing: -0.01em; }

/* Offline pill and banner */
.pill { position: absolute; left: 50%; top: 60px; transform: translateX(-50%); z-index: 5; display: inline-flex; align-items: center; gap: 6px; padding: 5px 11px; border-radius: 999px; background: var(--panel); border: 1px solid color-mix(in srgb, var(--warn) 50%, var(--line)); color: var(--warn); font-size: 12px; font-weight: 600; box-shadow: 0 4px 12px -4px rgb(0 0 0 / 0.2); }
.banner { display: flex; align-items: center; gap: 8px; padding: 8px 14px; background: var(--select); border-bottom: 1px solid var(--line); font-size: 12.5px; }
.banner a { margin-left: auto; color: var(--accent); font-weight: 650; text-decoration: none; }

/* Legacy frame */
.frame-wrap { flex: 1 1 auto; min-height: 0; position: relative; margin: 0; background: #fff; overflow: hidden; }
.legacy { padding: 16px; font: 13px/1.5 Georgia, serif; color: #222; background: #fff; height: 100%; }
.legacy h1 { font-size: 20px; margin: 0 0 6px; }
.legacy .lg-img { height: 120px; margin: 10px 0; border-radius: 4px; background: linear-gradient(120deg, #ccd6e6, #e6dccc); }
.legacy .lg-row { display: flex; gap: 8px; } .legacy .lg-row div { flex: 1; height: 70px; background: #eee; border-radius: 4px; }
.frame-wrap .pin { position: absolute; }
.placing { position: absolute; inset: 0; border: 3px solid var(--accent); pointer-events: none; }
.placing span { position: absolute; bottom: 8px; left: 50%; transform: translateX(-50%); padding: 4px 10px; border-radius: 999px; background: var(--accent); color: var(--on-accent); font-size: 12px; font-weight: 600; white-space: nowrap; }
.sandbox-note { flex: 0 0 auto; display: flex; gap: 8px; align-items: center; padding: 7px 14px; background: var(--panel-2); border-bottom: 1px solid var(--line); color: var(--muted); font-size: 12px; }

/* ---------- Desktop split view ---------- */
.desk-fig { width: 100%; }
.desk { width: 100%; max-width: 1240px; height: 720px; display: grid; grid-template-rows: auto 1fr; border: 1px solid var(--line); border-radius: 12px; overflow: hidden; background: var(--bg); box-shadow: 0 10px 30px -12px rgb(0 0 0 / 0.25); }
.desk-top { display: flex; align-items: center; gap: 16px; height: 48px; padding: 0 16px; background: var(--bg); border-bottom: 1px solid var(--line); font-size: 13px; }
.desk-top .brand { font-weight: 650; display: flex; align-items: center; gap: 8px; }
.desk-top .crumb { color: var(--muted); }
.desk-top .crumb b { color: var(--text); }
.desk-top .keys { margin-left: auto; color: var(--muted); font-size: 12px; }
kbd { display: inline-block; min-width: 20px; padding: 1px 5px; border: 1px solid var(--line); border-bottom-width: 2px; border-radius: 5px; background: var(--panel); font: 600 11px var(--mono); text-align: center; color: var(--text); }
.desk-cols { display: grid; grid-template-columns: 280px 1fr 320px; min-height: 0; }
.desk-cols > * { min-height: 0; overflow: auto; }
.col-l { border-right: 1px solid var(--line); background: var(--panel); }
.col-l .it { grid-template-columns: 1fr auto 20px; min-height: 36px; padding: 4px 14px; font-size: 13px; }
.col-l .it.cur { background: var(--select); box-shadow: inset 2px 0 0 var(--accent); }
.col-c { display: flex; flex-direction: column; }
.col-c .item-top { display: flex; align-items: center; gap: 10px; padding: 12px 18px; border-bottom: 1px solid var(--line); background: var(--panel); }
.col-c .item-top h3 { margin: 0; font-size: 16px; flex: 1 1 auto; }
.col-c .item-top .num { color: var(--muted); font-size: 12px; }
.col-c .body { flex: 1 1 auto; overflow: auto; padding: 16px 18px; }
.col-c .answer { grid-template-columns: repeat(4, auto) 1fr; justify-content: start; padding: 8px 18px; }
.col-c .answer button { grid-auto-flow: column; gap: 6px; padding: 7px 12px; font-size: 13px; }
.col-c .answer button .icon { width: 18px; height: 18px; }
.col-c .answer kbd { margin-left: 2px; }
.col-r { border-left: 1px solid var(--line); background: var(--panel); }
.col-r h4 { margin: 0; padding: 12px 14px 8px; font-size: 13px; display: flex; justify-content: space-between; }
.col-r h4 span { color: var(--muted); font-weight: 450; }
.rnote { padding: 10px 14px; border-top: 1px solid var(--line); font-size: 12.5px; display: grid; grid-template-columns: 22px 1fr; gap: 8px; }
.rnote .pin { width: 22px; height: 22px; font-size: 11px; }
.rnote small { display: block; color: var(--muted); font-size: 11.5px; margin-bottom: 2px; }
.rnote.cur { background: var(--select); }
.help-pop { position: absolute; right: 336px; bottom: 64px; width: 330px; padding: 12px 14px; border: 1px solid var(--line); border-radius: 12px; background: var(--panel); box-shadow: 0 14px 34px -10px rgb(0 0 0 / 0.35); font-size: 12.5px; }
.help-pop h4 { margin: 0 0 8px; font-size: 13px; display: flex; justify-content: space-between; }
.help-pop dl { display: grid; grid-template-columns: auto 1fr; gap: 5px 10px; margin: 0; }
.help-pop dd { margin: 0; color: var(--muted); }
.desk-wrap { position: relative; }
.desk-narrow { display: none; padding: 12px 16px; color: var(--muted); font-size: 13px; border: 1px dashed var(--line); border-radius: 10px; margin: 0 16px; }
@media (max-width: 1100px) { .desk-cols { grid-template-columns: 240px 1fr; } .col-r, .help-pop { display: none; } }
@media (max-width: 900px) { .desk { display: none; } .desk-narrow { display: block; } }
</style>
