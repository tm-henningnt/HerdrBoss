<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<title>M1 Mailbox and Chat</title>
<style>
/* Incumbent Herdr Boss tokens, copied from public/style.css. The mockup adds no new colors. */
:root {
  --bg: #f4f2ee; --panel: #ffffff; --panel-2: #f8f6f2; --line: #e3dfd7; --text: #1d1b18; --muted: #6f6a61; --faint: #a19b90;
  --accent: #d0621f; --ok: #2f8a4c; --warn: #b7791f; --crit: #c2362b; --info: #3a6ea5;
  --mono: ui-monospace, "SF Mono", "JetBrains Mono", Menlo, monospace;
  --sans: -apple-system, BlinkMacSystemFont, "Inter", "Segoe UI", sans-serif;
  --owner-bubble: color-mix(in srgb, var(--accent) 14%, var(--panel));
  --select: color-mix(in srgb, var(--accent) 12%, var(--panel-2));
  --bar-h: 52px;
  --kbd-h: 0px;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #121110; --panel: #1b1a18; --panel-2: #22201d; --line: #2e2b27; --text: #ece8e1; --muted: #a39d92; --faint: #6c665d;
    --accent: #ef8a4a; --ok: #5cbf7a; --warn: #e0a84a; --crit: #ef6a5e; --info: #74a6dd; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #121110; --panel: #1b1a18; --panel-2: #22201d; --line: #2e2b27; --text: #ece8e1; --muted: #a39d92; --faint: #6c665d;
  --accent: #ef8a4a; --ok: #5cbf7a; --warn: #e0a84a; --crit: #ef6a5e; --info: #74a6dd; color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body { background: var(--bg); color: var(--text); font: 14px/1.45 var(--sans); -webkit-font-smoothing: antialiased; overflow: hidden; }
::selection { background: color-mix(in srgb, var(--accent) 30%, transparent); }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
textarea, input { caret-color: var(--accent); }
* { scrollbar-width: thin; scrollbar-color: var(--line) transparent; }
button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; }
a { color: inherit; }
.icon { width: 22px; height: 22px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; flex: 0 0 auto; }
.icon-sm { width: 16px; height: 16px; }
.num { font-family: var(--mono); font-variant-numeric: tabular-nums; }
.vh { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }

/* ---------- The app shell ----------
   The shell is exactly the visual viewport: 100dvh, minus the keyboard when it is open.
   The real build sets --app-h from visualViewport.height. The mockup subtracts a fake keyboard. */
.shell { height: calc(100dvh - var(--kbd-h)); display: flex; flex-direction: column; overflow: hidden; }
.kbd { height: var(--kbd-h); background: #d1d3d9; display: none; }
:root[data-theme="dark"] .kbd { background: #2b2b2e; }
.kbd-open .kbd { display: grid; place-items: center; color: #6b6e75; font: 12px var(--mono); }

/* Desktop keeps the global header. The phone app view hides it. */
.global { flex: 0 0 auto; display: flex; align-items: center; gap: 18px; height: 48px; padding: 0 20px; border-bottom: 1px solid var(--line); background: var(--bg); }
.brand { display: flex; align-items: center; gap: 8px; font-weight: 650; }
.brand svg { width: 20px; height: 20px; fill: none; stroke: var(--accent); stroke-width: 2; }
.brand svg circle:first-child { fill: var(--accent); }
.global nav { display: flex; gap: 2px; }
.global nav a { padding: 6px 10px; border-radius: 6px; color: var(--muted); text-decoration: none; font-size: 13px; }
.global nav a[aria-current] { color: var(--text); background: var(--panel-2); font-weight: 600; }
.global .live { margin-left: auto; color: var(--muted); font-size: 12px; display: flex; align-items: center; gap: 7px; }
.global .live i { width: 8px; height: 8px; border-radius: 50%; background: var(--ok); }

/* The slim app bar. It carries the safe-area inset at the top. */
.bar { flex: 0 0 auto; display: flex; align-items: center; gap: 4px; min-height: var(--bar-h); padding: env(safe-area-inset-top) max(6px, env(safe-area-inset-right)) 0 max(6px, env(safe-area-inset-left)); background: var(--panel); border-bottom: 1px solid var(--line); }
.bar h1 { flex: 1 1 auto; min-width: 0; margin: 0 4px; font-size: 17px; font-weight: 650; letter-spacing: -0.01em; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.bar .count { color: var(--muted); font: 500 13px var(--mono); margin-left: 6px; }
.ibtn { position: relative; display: grid; place-items: center; width: 44px; height: 44px; border-radius: 50%; color: var(--text); }
.ibtn:hover { background: var(--panel-2); }
.ibtn .dot { position: absolute; top: 9px; right: 9px; width: 8px; height: 8px; border-radius: 50%; background: var(--accent); box-shadow: 0 0 0 2px var(--panel); }
.bar-title { flex: 1 1 auto; min-width: 0; display: flex; align-items: center; gap: 10px; }
.bar-title .who { min-width: 0; display: grid; }
.bar-title strong { font-size: 15.5px; font-weight: 650; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.bar-title small { color: var(--muted); font-size: 12px; display: flex; align-items: center; gap: 5px; }
.presence { width: 7px; height: 7px; border-radius: 50%; background: var(--ok); }
.presence.idle { background: var(--faint); }

/* Selection mode replaces the bar, as in Gmail. */
.bar.selecting { background: var(--select); }
.bar.selecting h1 { font-size: 16px; }

/* Avatars: the incumbent stable circles. */
.av { flex: 0 0 auto; display: grid; place-items: center; width: 40px; height: 40px; border-radius: 50%; color: #fff; font: 650 14px var(--mono); }
.av.s32 { width: 32px; height: 32px; font-size: 12px; }
.av.s28 { width: 28px; height: 28px; font-size: 11px; }
.av.s24 { width: 24px; height: 24px; font-size: 10px; }
.av.boss { background: var(--panel-2); box-shadow: inset 0 0 0 1px var(--line); }
.av.boss svg { width: 58%; height: 58%; fill: var(--accent); }
.av.checked { background: var(--accent); color: #fff; }
.c1 { background: #2f6f9f; } .c2 { background: #1f7a6a; } .c3 { background: #7a4bb0; } .c4 { background: #9c5c22; } .c5 { background: #a24a8f; }

/* ---------- Mailbox list: one dense row per conversation ---------- */
.body { flex: 1 1 auto; min-height: 0; display: flex; }
.pane { min-width: 0; min-height: 0; display: flex; flex-direction: column; background: var(--panel); }
.scroll { flex: 1 1 auto; min-height: 0; overflow-y: auto; overscroll-behavior: contain; }
.rows { list-style: none; margin: 0; padding: 0 0 env(safe-area-inset-bottom); }
.row { position: relative; display: grid; grid-template-columns: 40px minmax(0, 1fr) auto; grid-template-rows: auto auto; column-gap: 12px; row-gap: 2px; align-items: center; min-height: 68px; padding: 9px max(14px, env(safe-area-inset-right)) 9px max(14px, env(safe-area-inset-left)); border-bottom: 1px solid color-mix(in srgb, var(--line) 70%, transparent); cursor: pointer; }
.row:hover { background: var(--panel-2); }
.row[aria-selected="true"] { background: var(--select); }
.row .av { grid-column: 1; grid-row: 1 / span 2; }
.row .l1 { grid-column: 2; grid-row: 1; }
.row .l2 { grid-column: 2; grid-row: 2; }
.row .side { grid-column: 3; grid-row: 1 / span 2; }
.row .l1, .row .l2 { display: flex; align-items: baseline; gap: 6px; min-width: 0; }
.row .from { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 14.5px; }
.row .thread-n { color: var(--muted); font: 12px var(--mono); }
.row .subj { flex: 0 1 auto; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 13.5px; }
.row .prev { flex: 1 1 0; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--muted); font-size: 13.5px; }
.row .side { display: grid; justify-items: end; align-content: center; gap: 5px; align-self: stretch; }
.row time { color: var(--muted); font: 12px var(--mono); white-space: nowrap; }
.row.unread .from, .row.unread .subj { font-weight: 650; }
.row.unread time { color: var(--accent); font-weight: 600; }
.udot { width: 9px; height: 9px; border-radius: 50%; background: var(--accent); }
.act { display: inline-flex; align-items: center; height: 18px; padding: 0 6px; border-radius: 4px; font: 600 10.5px var(--mono); text-transform: uppercase; letter-spacing: 0.04em; color: var(--accent); background: color-mix(in srgb, var(--accent) 13%, transparent); flex: 0 0 auto; }
.act.report { color: var(--info); background: color-mix(in srgb, var(--info) 13%, transparent); }
.act.done { color: var(--ok); background: color-mix(in srgb, var(--ok) 13%, transparent); }
.row-sep { position: sticky; top: 0; z-index: 1; margin: 0; padding: 7px 16px 5px; background: var(--panel-2); color: var(--muted); font: 600 11.5px var(--sans); letter-spacing: 0.02em; border-bottom: 1px solid var(--line); }

/* The list toolbar on desktop: select all, bulk actions, compose, count. */
.tools { flex: 0 0 auto; display: flex; align-items: center; gap: 2px; height: 44px; padding: 0 8px; border-bottom: 1px solid var(--line); }
.tools .spacer { flex: 1; }
.tools .ibtn { width: 36px; height: 36px; border-radius: 8px; }
.tools .range { color: var(--muted); font: 12px var(--mono); padding: 0 8px; }
.cb { width: 18px; height: 18px; border: 1.6px solid var(--muted); border-radius: 4px; display: grid; place-items: center; }
.cb.on { background: var(--accent); border-color: var(--accent); }
.cb.on svg { stroke: #fff; width: 14px; height: 14px; }

/* Folder drawer on the phone. Folders on top, pages below, as in the Gmail drawer. */
.scrim { position: fixed; inset: 0; background: rgb(0 0 0 / 0.32); z-index: 20; }
.drawer { position: fixed; z-index: 21; inset: 0 auto 0 0; width: min(304px, 84vw); display: flex; flex-direction: column; padding: calc(10px + env(safe-area-inset-top)) 10px 10px max(10px, env(safe-area-inset-left)); background: var(--panel); box-shadow: 4px 0 28px rgb(0 0 0 / 0.18); overflow-y: auto; }
.drawer .brand { padding: 8px 12px 14px; }
.folders { display: grid; gap: 1px; margin: 0; padding: 0; list-style: none; }
.folders a { display: flex; align-items: center; gap: 14px; white-space: nowrap; height: 44px; padding: 0 14px; border-radius: 22px; text-decoration: none; color: var(--text); font-size: 14px; }
.folders a[aria-current] { background: color-mix(in srgb, var(--accent) 16%, var(--panel)); font-weight: 650; }
.folders a .n { margin-left: auto; font: 600 12px var(--mono); color: var(--muted); }
.folders a[aria-current] .n { color: var(--accent); }
.folders hr, .drawer hr { border: 0; border-top: 1px solid var(--line); margin: 8px 12px; }
.drawer h2 { margin: 6px 14px 4px; color: var(--muted); font-size: 12px; font-weight: 600; }

/* Desktop folder rail. */
.rail { flex: 0 0 240px; padding: 10px 8px; border-right: 1px solid var(--line); background: var(--bg); overflow-y: auto; }
.compose { display: inline-flex; align-items: center; gap: 10px; height: 44px; padding: 0 18px 0 14px; margin: 2px 0 12px 2px; border-radius: 14px; background: var(--owner-bubble); color: var(--text); font-weight: 600; }
.rail .folders a { height: 36px; border-radius: 0 18px 18px 0; margin-left: -8px; padding-left: 22px; }
.rail .limits { margin: 14px 10px 0; color: var(--faint); font-size: 11.5px; line-height: 1.4; }

/* The floating compose button on the phone list. */
.fab { position: absolute; right: max(16px, env(safe-area-inset-right)); bottom: calc(16px + env(safe-area-inset-bottom)); display: inline-flex; align-items: center; gap: 10px; height: 52px; padding: 0 20px 0 16px; border-radius: 16px; background: var(--owner-bubble); color: var(--text); font-weight: 650; box-shadow: 0 4px 14px rgb(0 0 0 / 0.14); }

/* ---------- Mailbox thread ---------- */
.thread-head { padding: 14px 16px 6px; }
.thread-head h2 { margin: 0; font-size: 19px; line-height: 1.3; font-weight: 650; letter-spacing: -0.01em; text-wrap: balance; }
.thread-head .chips { display: flex; gap: 6px; margin-top: 8px; }
.msg { padding: 12px 16px 14px; border-bottom: 1px solid var(--line); }
.msg-top { display: grid; grid-template-columns: 40px minmax(0, 1fr) auto; column-gap: 12px; align-items: center; }
.msg-top strong { font-size: 14px; }
.msg-top .to { color: var(--muted); font-size: 12.5px; }
.msg-top time { color: var(--muted); font: 12px var(--mono); }
.msg.collapsed { display: grid; grid-template-columns: 40px minmax(0, 1fr) auto; column-gap: 12px; align-items: center; padding-block: 10px; }
.msg.collapsed .snip { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--muted); font-size: 13px; }
.msg.collapsed strong { font-size: 13.5px; }
.msg-body { padding: 10px 0 0 52px; }
.from-owner .msg-top strong::after { content: ' · you'; color: var(--muted); font-weight: 400; }

/* The slim action bar. It stays at the bottom of the thread, above the keyboard and the home indicator. */
.actionbar { flex: 0 0 auto; display: flex; align-items: center; gap: 8px; padding: 8px max(10px, env(safe-area-inset-right)) calc(8px + env(safe-area-inset-bottom)) max(10px, env(safe-area-inset-left)); border-top: 1px solid var(--line); background: var(--panel); overflow-x: auto; }
.actionbar .btn { flex: 0 0 auto; display: inline-flex; align-items: center; gap: 7px; height: 40px; padding: 0 16px; border-radius: 20px; border: 1px solid var(--line); font-weight: 600; font-size: 13.5px; white-space: nowrap; }
.actionbar .btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
.actionbar .btn.deny { color: var(--crit); }
.actionbar .grow { flex: 1 0 0; }
.actionbar .ibtn { width: 40px; height: 40px; }
.desktop-actions { display: flex; align-items: center; gap: 2px; margin-left: auto; }
.desktop-actions .ibtn { width: 36px; height: 36px; border-radius: 8px; color: var(--muted); }

/* ---------- Markdown ---------- */
.md { font-size: 14px; line-height: 1.55; overflow-wrap: anywhere; max-width: 72ch; }
.md > :first-child { margin-top: 0; }
.md > :last-child { margin-bottom: 0; }
.md h1, .md h2, .md h3, .md h4 { margin: 18px 0 6px; line-height: 1.3; letter-spacing: -0.005em; color: var(--text); text-transform: none; }
.md h1 { font-size: 17px; font-weight: 700; }
.md h2 { font-size: 15.5px; font-weight: 650; }
.md h3 { font-size: 14.5px; font-weight: 650; }
.md h4 { font-size: 14px; font-weight: 600; color: var(--muted); }
.md p { margin: 6px 0; }
.md ul, .md ol { margin: 6px 0; padding-left: 22px; }
.md li { margin: 3px 0; }
.md li > ul, .md li > ol { margin: 2px 0; }
.md li::marker { color: var(--muted); }
.md ul.task { list-style: none; padding-left: 4px; }
.md ul.task li { display: flex; gap: 8px; align-items: baseline; }
.md ul.task input { accent-color: var(--accent); margin: 0; translate: 0 2px; }
.md code { font: 12.5px var(--mono); padding: 1px 5px; border-radius: 4px; background: var(--panel-2); border: 1px solid var(--line); }
.md pre { margin: 8px 0; padding: 10px 12px; overflow-x: auto; border-radius: 8px; background: var(--panel-2); border: 1px solid var(--line); }
.md pre code { padding: 0; border: 0; background: none; font-size: 12.5px; line-height: 1.5; }
.md blockquote { margin: 8px 0; padding: 2px 0 2px 12px; border-left: 1px solid var(--faint); color: var(--muted); }
.md hr { border: 0; border-top: 1px solid var(--line); margin: 14px 0; }
.md a { color: color-mix(in srgb, var(--accent) 82%, var(--text)); text-underline-offset: 2px; }
.md a .ext { width: 11px; height: 11px; margin-left: 2px; vertical-align: -1px; stroke-width: 2.2; }
.md .table { margin: 8px 0; overflow-x: auto; border: 1px solid var(--line); border-radius: 8px; }
.md table { border-collapse: collapse; min-width: 100%; font-size: 13px; }
.md th, .md td { padding: 6px 10px; text-align: left; vertical-align: top; border-bottom: 1px solid var(--line); }
.md th { background: var(--panel-2); font-weight: 650; white-space: nowrap; }
.md tr:last-child td { border-bottom: 0; }
.md td.n { text-align: right; font-family: var(--mono); font-variant-numeric: tabular-nums; }

/* ---------- Chat ---------- */
.chat-row { display: grid; grid-template-columns: 52px minmax(0, 1fr) auto; column-gap: 12px; align-items: center; min-height: 72px; padding: 8px max(14px, env(safe-area-inset-right)) 8px max(14px, env(safe-area-inset-left)); cursor: pointer; }
.chat-row:hover { background: var(--panel-2); }
.chat-row[aria-current] { background: var(--select); }
.chat-row .av { width: 52px; height: 52px; font-size: 17px; position: relative; }
.chat-row .av .presence { position: absolute; right: 1px; bottom: 1px; width: 13px; height: 13px; box-shadow: 0 0 0 2.5px var(--panel); }
.chat-row .name { font-size: 15px; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.chat-row .last { display: flex; gap: 4px; min-width: 0; color: var(--muted); font-size: 13.5px; }
.chat-row .last span { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.chat-row .side { display: grid; justify-items: end; gap: 6px; }
.chat-row time { color: var(--muted); font: 12px var(--mono); }
.chat-row.unread .name, .chat-row.unread .last { color: var(--text); font-weight: 650; }
.chat-row.unread time { color: var(--accent); font-weight: 600; }
.badge { min-width: 20px; height: 20px; padding: 0 6px; border-radius: 10px; background: var(--accent); color: #fff; font: 650 11.5px/20px var(--mono); text-align: center; }
.badge.q { background: transparent; box-shadow: inset 0 0 0 1.5px var(--accent); color: var(--accent); }

.log { flex: 1 1 auto; min-height: 0; overflow-y: auto; overscroll-behavior: contain; padding: 6px max(10px, env(safe-area-inset-right)) 10px max(10px, env(safe-area-inset-left)); display: flex; flex-direction: column; }
.log > :first-child { margin-top: auto; }
.day { align-self: center; position: sticky; top: 6px; z-index: 1; margin: 12px 0 8px; padding: 3px 10px; border-radius: 10px; background: color-mix(in srgb, var(--panel) 88%, transparent); box-shadow: 0 1px 3px rgb(0 0 0 / 0.08); color: var(--muted); font: 600 11.5px var(--sans); }
.unread-mark { display: flex; align-items: center; gap: 10px; margin: 10px 0 8px; color: var(--accent); font: 600 11.5px var(--sans); }
.unread-mark::before, .unread-mark::after { content: ''; flex: 1; border-top: 1px solid color-mix(in srgb, var(--accent) 45%, transparent); }
.group { display: grid; grid-template-columns: 28px minmax(0, 1fr); column-gap: 8px; margin-top: 8px; }
.group .av { grid-row: 1 / span 20; align-self: end; }
.group.mine { grid-template-columns: minmax(0, 1fr); }
.gname { grid-column: 2; margin: 0 0 2px 12px; color: var(--muted); font-size: 11.5px; font-weight: 600; }
.b { grid-column: 2; justify-self: start; max-width: min(78%, 560px); margin-top: 2px; padding: 7px 11px; border-radius: 18px; background: var(--panel-2); box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--line) 60%, transparent); font-size: 14.5px; line-height: 1.4; overflow-wrap: anywhere; }
.mine .b { grid-column: 1; justify-self: end; background: var(--owner-bubble); box-shadow: none; }
/* Messenger corners: a run of bubbles has a tight inner corner. The last bubble keeps the tail corner. */
.group:not(.mine) .b:not(:last-child) { border-bottom-left-radius: 5px; }
.group:not(.mine) .b + .b { border-top-left-radius: 5px; }
.mine .b:not(:last-child) { border-bottom-right-radius: 5px; }
.mine .b + .b { border-top-right-radius: 5px; }
.b .md { font-size: 14.5px; line-height: 1.4; }
.b .md p { margin: 0; }
.b .md p + p, .b .md ul, .b .md ol { margin-top: 4px; }
.meta { display: flex; justify-content: flex-end; align-items: center; gap: 3px; margin: 2px 0 -2px 10px; float: right; translate: 0 5px; color: var(--muted); font: 11px var(--mono); }
.meta .icon { width: 15px; height: 15px; stroke-width: 2; }
.meta .read { color: var(--accent); }
.meta .fail { color: var(--crit); }
.b::after { content: ''; display: block; clear: both; }
.b.card { padding-bottom: 9px; }
.opts { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; clear: both; }
.opts button { height: 34px; padding: 0 14px; border-radius: 17px; border: 1px solid var(--line); background: var(--panel); font-weight: 600; font-size: 13px; }
.opts button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
.opts button.deny { color: var(--crit); }
.report-chip { grid-column: 2; justify-self: start; display: flex; align-items: center; gap: 10px; margin-top: 2px; max-width: min(78%, 560px); padding: 9px 12px; border-radius: 14px; border: 1px solid var(--line); background: var(--panel); font-size: 13.5px; text-decoration: none; }
.report-chip .icon { color: var(--info); }
.report-chip span { min-width: 0; }
.report-chip small { display: block; color: var(--muted); font-size: 12px; }
.jump { position: absolute; right: max(14px, env(safe-area-inset-right)); bottom: 12px; display: grid; place-items: center; width: 40px; height: 40px; border-radius: 50%; background: var(--panel); border: 1px solid var(--line); box-shadow: 0 2px 10px rgb(0 0 0 / 0.14); }
.jump .badge { position: absolute; top: -7px; right: -5px; min-width: 18px; height: 18px; font-size: 10.5px; line-height: 18px; }

.composer { flex: 0 0 auto; display: flex; align-items: flex-end; gap: 6px; padding: 6px max(8px, env(safe-area-inset-right)) calc(6px + env(safe-area-inset-bottom)) max(8px, env(safe-area-inset-left)); background: var(--panel); border-top: 1px solid var(--line); }
.kbd-open .composer { padding-bottom: 6px; }
.field { flex: 1 1 auto; min-width: 0; min-height: 40px; max-height: calc(1.4em * 6 + 18px); padding: 9px 14px; border-radius: 20px; background: var(--panel-2); border: 1px solid var(--line); font-size: 15px; line-height: 1.4; color: var(--text); overflow-y: auto; }
.field.empty { color: var(--faint); }
.field .caret { display: inline-block; width: 1.5px; height: 1.1em; background: var(--accent); vertical-align: -2px; }
.send { flex: 0 0 auto; display: grid; place-items: center; width: 40px; height: 40px; border-radius: 50%; background: var(--accent); color: #fff; }
.send svg { width: 19px; height: 19px; fill: currentColor; stroke: none; }
.send[disabled] { background: var(--panel-2); color: var(--faint); }

/* ---------- Layout switch ---------- */
.stage { position: relative; flex: 1 1 auto; min-height: 0; display: flex; }
@media (max-width: 760px) {
  .global, .rail, .tools, .desktop-only { display: none !important; }
  .pane { flex: 1 1 auto; }
  .split > .pane.list { display: flex; }
  .split.open > .pane.list { display: none; }
  .split:not(.open) > .pane.detail { display: none; }
  .msg-body { padding-left: 0; }
}
@media (min-width: 761px) {
  .phone-only { display: none !important; }
  .stage { background: var(--bg); }
  .split > .pane.list { flex: 0 0 var(--list-w, 400px); border-right: 1px solid var(--line); }
  .split > .pane.detail { flex: 1 1 auto; }
  .chat .split > .pane.list { --list-w: 340px; }
  .mail .row { grid-template-columns: 22px 28px minmax(140px, 200px) minmax(0, 1fr) auto; grid-template-rows: auto; min-height: 40px; padding: 0 14px 0 10px; column-gap: 10px; }
  .mail .row .cbx { grid-column: 1; grid-row: 1; }
  .mail .row .av { grid-column: 2; grid-row: 1; width: 28px; height: 28px; font-size: 11px; }
  .mail .row .l1 { grid-column: 3; grid-row: 1; }
  .mail .row .l2 { grid-column: 4; grid-row: 1; }
  .mail .row .side { grid-column: 5; grid-row: 1; grid-auto-flow: column; align-items: center; gap: 10px; }
  .mail .row .from { font-size: 13.5px; }
  .mail.threadless .split > .pane.list { flex: 1 1 auto; border-right: 0; }
  .mail.threadless .pane.detail { display: none; }
  .mail .split.open > .pane.list { --list-w: 420px; }
  .mail .split.open .row { grid-template-columns: 22px 28px minmax(0, 1fr) auto; grid-template-rows: auto auto; padding: 8px 14px 8px 10px; row-gap: 1px; }
  .mail .split.open .row .cbx, .mail .split.open .row .av { grid-row: 1 / span 2; }
  .mail .split.open .row .l1 { grid-column: 3; grid-row: 1; }
  .mail .split.open .row .l2 { grid-column: 3; grid-row: 2; }
  .mail .split.open .row .prev { display: none; }
  .mail .split.open .row .side { grid-column: 4; grid-row: 1 / span 2; grid-auto-flow: row; }
  .msg { padding-inline: 24px; }
  .thread-head { padding: 18px 24px 8px; }
  .thread-head h2 { font-size: 21px; }
  .log { padding-inline: 20px; }
  .b { max-width: min(68%, 620px); }
  .actionbar { padding-inline: 24px; }
}
.cbx { display: none; }
@media (min-width: 761px) { .mail .cbx { display: grid; } }
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">

  <symbol id="i-needs" viewBox="0 0 24 24"><path d="M12 3.5 21.5 20h-19L12 3.5Z"/><path d="M12 10v4.5M12 17.2v.1"/></symbol>
  <symbol id="i-done" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5"/><path d="m8 12.3 2.8 2.8L16.3 9.5"/></symbol>
  <symbol id="i-sent" viewBox="0 0 24 24"><path d="M4 12 20 4.5 15.5 20l-3.5-6.5L4 12Z"/><path d="m12 13.5 8-9"/></symbol>
  <symbol id="i-crown" viewBox="0 0 40 40"><path d="M10.5 25 9 15.4l5.6 3.8L20 11.5l5.4 7.7 5.6-3.8L29.5 25Z"/><rect x="10.5" y="26.4" width="19" height="2.8" rx="1.4"/></symbol>
</svg>
<div id="root"></div>
<script>
// A static mockup. Query parameters select one state, so each state can be captured at a real viewport size.
// page=mail|chat  open=1 (thread open)  theme=light|dark  kbd=1 (keyboard open)  select=1 (bulk select)  drawer=1  folder=needs|inbox|updates|done
const q = new URLSearchParams(location.search);
const page = q.get('page');
const open = q.get('open') === '1';
const kbd = q.get('kbd') === '1';
if (q.get('theme')) document.documentElement.dataset.theme = q.get('theme');
if (kbd) { document.documentElement.style.setProperty('--kbd-h', '291px'); document.body.classList.add('kbd-open'); }
const sendIcon = `<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3.5 20 21 12 3.5 4v6l12 2-12 2v6Z"/></svg>`;
const use = (id, cls = 'icon') => `<svg class="${cls}" aria-hidden="true"><use href="#i-${id}"/></svg>`;
const crown = `<svg viewBox="0 0 40 40" aria-hidden="true"><use href="#i-crown"/></svg>`;
const av = (who, size = '') => who === 'boss' ? `<span class="av boss ${size}">${crown}</span>` : `<span class="av ${size} ${PROJECTS[who].c}">${PROJECTS[who].i}</span>`;
const PROJECTS = { atlas: { i: 'AT', c: 'c1', name: 'Atlas' }, harbor: { i: 'HA', c: 'c2', name: 'Harbor' }, ledger: { i: 'LE', c: 'c4', name: 'Ledger' }, herdrboss: { i: 'HB', c: 'c3', name: 'HerdrBoss' } };
const brand = `<span class="brand"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3"/><circle cx="4" cy="6" r="2"/><circle cx="20" cy="6" r="2"/><circle cx="4" cy="18" r="2"/><circle cx="20" cy="18" r="2"/><path d="M6 7l4 3M18 7l-4 3M6 17l4-3M18 17l-4-3"/></svg>Herdr Boss</span>`;
const globalBar = (current) => `<header class="global">${brand}<nav aria-label="Main navigation">${['Overview', 'Mailbox', 'Chat', 'Agents', 'Projects', 'Browsers', 'Allocation', 'Analytics', 'Logs'].map((n) => `<a href="#"${n === current ? ' aria-current="page"' : ''}>${n}</a>`).join('')}</nav><span class="live"><i></i>updated 2 s ago</span></header>`;

if (!page) {
  const states = [
    ['Mailbox list, phone', 'page=mail'], ['Mailbox list, phone, dark', 'page=mail&theme=dark'], ['Mailbox folder drawer', 'page=mail&drawer=1'],
    ['Mailbox bulk select', 'page=mail&select=1'], ['Mailbox thread with report', 'page=mail&open=1'], ['Mailbox thread, dark', 'page=mail&open=1&theme=dark'], ['Mailbox approve item', 'page=mail&open=1&item=approve'],
    ['Mailbox thread, answer with keyboard', 'page=mail&open=1&kbd=1'],
    ['Chat list', 'page=chat'], ['Chat list, dark', 'page=chat&theme=dark'], ['Chat thread', 'page=chat&open=1'], ['Chat thread, keyboard open', 'page=chat&open=1&kbd=1'], ['Chat thread, dark', 'page=chat&open=1&theme=dark'], ['Chat thread, scrolled up with new messages', 'page=chat&open=1&scrolled=1'],
  ];
  document.body.style.overflow = 'auto';
  document.getElementById('root').innerHTML = `<main style="max-width:640px;margin:0 auto;padding:32px 20px"><h1 style="font-size:20px;margin:0 0 6px">M1 Mailbox and Chat mockup</h1><p style="color:var(--muted);margin:0 0 18px">Open a state. Resize the window: at 760 px and less the phone layout shows. Above 760 px the desktop layout shows.</p><ul style="line-height:2">${states.map(([n, s]) => `<li><a href="?${s}">${n}</a> <code style="color:var(--muted);font-size:12px">?${s}</code></li>`).join('')}</ul></main>`;
} else if (page === 'mail') renderMail(); else renderChat();

function renderMail() {
  const folder = q.get('folder') || 'inbox';
  const select = q.get('select') === '1';
  const FOLDERS = [['needs', 'Needs you', 'needs', 3], ['inbox', 'Inbox', 'inbox', 9], ['updates', 'Reports and updates', 'doc', 6], ['done', 'Done', 'done', 41]];
  const folderList = (rail) => `<ul class="folders">${FOLDERS.map(([k, label, icon, n]) => `<li><a href="?page=mail&folder=${k}"${k === folder ? ' aria-current="page"' : ''}>${use(icon)}<span>${label}</span><span class="n">${n}</span></a></li>`).join('')}<li><hr></li><li><a href="#">${use('sent')}<span>Sent</span></a></li></ul>`;
  const rows = [
    { id: 1, who: 'boss', from: 'Boss', act: 'Approve', subj: 'Hold new Claude workers until Thu 21:00?', prev: 'Claude is at 84% of its week. The orchestrators use about 3% an hour.', time: '07:41', unread: true },
    { id: 2, who: 'atlas', from: 'Atlas', act: 'Decide', subj: 'Release 1.1 now or after the review pass?', prev: 'Gates 2 to 7 are green. Gate 1 waits for CI next month.', time: '07:12', unread: true, n: 3 },
    { id: 3, who: 'harbor', from: 'Harbor', act: 'Answer', subj: 'Which tenant should the demo app use?', prev: 'The demo builder needs one tenant for the read-back check.', time: '06:55', unread: false },
  ];
  const sepRows = [
    { id: 4, who: 'boss', from: 'Boss', act: 'Report', cls: 'report', subj: 'Night report, 28–29 Sept', prev: 'Night watch ran from 01:00 to 07:00, and it ended by itself.', time: '07:32', unread: true },
    { id: 5, who: 'herdrboss', from: 'HerdrBoss', subj: 'Task G1 is merged and live', prev: 'The suite pass key now holds the lockfile hashes.', time: '05:10', unread: false, n: 2 },
    { id: 6, who: 'ledger', from: 'Ledger', subj: 'Gates 2 to 7 are green', prev: 'Gate 1 waits for CI. Nothing needs you.', time: 'Mon', unread: false },
  ];
  const selected = new Set(select ? [1, 3] : []);
  const row = (r) => `<li class="row${r.unread ? ' unread' : ''}" aria-selected="${selected.has(r.id) || (open && r.id === 4)}">
      <span class="cbx"><span class="cb${selected.has(r.id) ? ' on' : ''}">${selected.has(r.id) ? use('check') : ''}</span></span>
      ${selected.has(r.id) ? `<span class="av checked">${use('check')}</span>` : av(r.who)}
      <span class="l1"><span class="from">${r.from}</span>${r.n ? `<span class="thread-n">${r.n}</span>` : ''}</span>
      <span class="l2">${r.act ? `<span class="act ${r.cls || ''}">${r.act}</span>` : ''}<span class="subj">${r.subj}</span><span class="prev">— ${r.prev}</span></span>
      <span class="side"><time>${r.time}</time>${r.unread ? '<span class="udot" aria-label="Unread"></span>' : '<span style="width:9px"></span>'}</span>
    </li>`;
  const list = `<ol class="rows"><li class="row-sep" role="presentation">Needs you · 3</li>${rows.map(row).join('')}<li class="row-sep" role="presentation">Reports and updates</li>${sepRows.map(row).join('')}</ol>`;
  const bar = select
    ? `<div class="bar selecting"><button class="ibtn" aria-label="Clear selection">${use('close')}</button><h1>2 selected</h1><button class="ibtn" aria-label="Mark read">${use('read')}</button><button class="ibtn" aria-label="Dismiss">${use('dismiss')}</button><button class="ibtn" aria-label="More">${use('more')}</button></div>`
    : `<div class="bar"><button class="ibtn" aria-label="Folders and pages">${use('menu')}<span class="dot"></span></button><h1>Inbox<span class="count">9</span></h1><button class="ibtn" aria-label="Select">${use('check')}</button></div>`;
  const tools = `<div class="tools"><button class="ibtn" aria-label="Select all"><span class="cb${select ? ' on' : ''}">${select ? use('check') : ''}</span></button><button class="ibtn" aria-label="Mark read" title="Mark read">${use('read')}</button><button class="ibtn" aria-label="Dismiss" title="Dismiss">${use('dismiss')}</button><span class="spacer"></span><span class="range">1–6 of 9</span></div>`;
  const report = mdReport();
  const approve = q.get('item') === 'approve';
  const thread = `
    <div class="bar phone-only"><button class="ibtn" aria-label="Back to Inbox">${use('back')}</button><span style="flex:1"></span><button class="ibtn" aria-label="Mark unread">${use('read')}</button><button class="ibtn" aria-label="Dismiss">${use('dismiss')}</button><button class="ibtn" aria-label="More">${use('more')}</button></div>
    <div class="tools desktop-only"><button class="ibtn" aria-label="Close">${use('back')}</button><span class="spacer"></span><button class="ibtn" aria-label="Mark unread">${use('read')}</button><button class="ibtn" aria-label="Dismiss">${use('dismiss')}</button><button class="ibtn" aria-label="More">${use('more')}</button></div>
    <div class="scroll">
      ${approve ? `<div class="thread-head"><h2>Hold new Claude workers until Thu 21:00?</h2><div class="chips"><span class="act">Approve</span></div></div>
      <article class="msg"><div class="msg-top">${av('boss')}<span><strong>Boss</strong><div class="to">to you · asks for approval</div></span><time>07:41</time></div><div class="msg-body md"><p>Claude is at <strong>84%</strong> of its week. The reset is Thu 1 Oct 21:00.</p><p>The orchestrators and the Boss use about 3% an hour. I hold new Claude workers until the reset.</p><p>Say if you want a different trade-off.</p></div></article>` : `<div class="thread-head"><h2>Night report, 28–29 Sept</h2><div class="chips"><span class="act report">Report</span></div></div>
      <div class="msg collapsed from-owner">${`<span class="av s32" style="background:var(--panel-2);color:var(--muted);box-shadow:inset 0 0 0 1px var(--line)">You</span>`}<span style="min-width:0"><strong>You</strong><div class="snip">Send the night report at 07:30, with the scorecard.</div></span><time class="num" style="color:var(--muted);font-size:12px">Mon 22:04</time></div>
      <article class="msg"><div class="msg-top">${av('boss')}<span><strong>Boss</strong><div class="to">to you · report</div></span><time>07:32</time></div><div class="msg-body md">${report}</div></article>`}
    </div>
    ${kbd ? `<form class="composer"><div class="field"><span>Hold them. Resume at the reset</span><span class="caret"></span></div><button class="send" type="button" aria-label="Send">${sendIcon}</button></form>`
      : approve ? `<div class="actionbar"><button class="btn primary">${use('check')}Approve</button><button class="btn deny">Decline</button><button class="btn">${use('reply')}Reply</button><span class="grow"></span><button class="ibtn" aria-label="Dismiss">${use('dismiss')}</button></div>`
      : `<div class="actionbar"><button class="btn primary">${use('reply')}Reply</button><button class="btn">${use('done')}Mark done</button><span class="grow"></span><button class="ibtn" aria-label="Dismiss">${use('dismiss')}</button></div>`}`;
  const drawer = q.get('drawer') === '1' ? `<div class="scrim"></div><nav class="drawer" aria-label="Folders and pages">${brand}${folderList()}<hr><h2>Pages</h2><ul class="folders">${['Overview', 'Chat', 'Agents', 'Projects', 'Browsers', 'Allocation', 'Analytics', 'Logs'].map((n) => `<li><a href="#" style="padding-left:52px"><span>${n}</span>${n === 'Chat' ? '<span class="n">2</span>' : ''}</a></li>`).join('')}</ul></nav>` : '';
  document.body.classList.add('mail');
  if (!open) document.body.classList.add('threadless');
  document.getElementById('root').innerHTML = `<div class="shell">${globalBar('Mailbox')}
    <div class="stage">
      <aside class="rail"><button class="compose">${use('pen')}New message</button>${folderList(true)}<p class="limits">Herdr Boss keeps messages for 30 days.</p></aside>
      <div class="split${open ? ' open' : ''}" style="display:flex;flex:1;min-width:0">
        <section class="pane list" aria-label="Inbox">${bar.replace('class="bar', 'class="bar phone-only')}${tools}<div class="scroll">${list}</div>${select ? '' : `<button class="fab phone-only">${use('pen')}New</button>`}</section>
        <section class="pane detail" aria-label="Conversation">${thread}</section>
      </div>
    </div></div><div class="kbd">keyboard</div>${drawer}`;
}


function mdReport() {
  // What the in-repo renderer must output for the report fixture. Names are placeholders.
  return `<p>Night watch ran from 01:00 to 07:00, and it ended by itself. All active projects moved forward all night.</p>
  <h2>Atlas</h2>
  <ul><li><strong>Release 1.0.0 is done.</strong> It is tagged <code>v1.0.0</code>, and the demo runs 1.0.0.</li><li><strong>Gap:</strong> serve-live was named in 6 briefs but used in none.
    <ul><li>Since 05:20 the review refuses a report without serve-live evidence.</li></ul></li></ul>
  <h2>Free models and the scorecard</h2>
  <div class="table" role="region" aria-label="Table" tabindex="0"><table><thead><tr><th>Harness and model</th><th>Runs</th><th>Result</th></tr></thead><tbody>
    <tr><td>Pi with a free model</td><td class="n">24</td><td>No failures. Median 41 min. Good for exact specs.</td></tr>
    <tr><td>Codex</td><td class="n">25</td><td>About 1 in 4 needed rework. Median 57 min.</td></tr>
    <tr><td>Sonnet 5.5 reviews</td><td class="n">7</td><td>4 right first time.</td></tr></tbody></table></div>
  <blockquote><p>Only 5 of 40 runs have a structured model result so far.</p></blockquote>
  <pre><code>herdr-boss suite --reuse -- npm test</code></pre>
  <hr>
  <h2>Needs you</h2>
  <ol><li><strong>Two optional Claude settings lines</strong> in <code>autoMode.allow</code>.<ul><li>Workers may write in their own <code>.worker/</code> folder.</li><li>Workers may stop their own server by its saved PID.</li></ul></li><li><strong>The Claude quota hold.</strong> Claude is at 84% of its week.</li></ol>
  <ul class="task"><li><input type="checkbox" disabled checked aria-label="done"> Backups taken first</li><li><input type="checkbox" disabled aria-label="not done"> Rollback drill</li></ul>
  <p>Full scorecard: <a href="https://example.com/scorecard" target="_blank" rel="noopener noreferrer">model scorecard${use('ext', 'icon ext')}</a></p>`;
}

function renderChat() {
  const chats = [
    { who: 'boss', name: 'Boss', last: 'Say if you want a different trade-off.', time: '07:41', unread: 2, presence: 'working' },
    { who: 'atlas', name: 'Atlas', last: 'Release 1.1 now or after the review pass?', time: '07:12', unread: 1, q: true, presence: 'working' },
    { who: 'herdrboss', name: 'HerdrBoss', last: 'You: Merge it when the suite is green.', time: '05:02', presence: 'idle', mine: 'read' },
    { who: 'harbor', name: 'Harbor', last: 'Which tenant should the demo app use?', time: '06:55', presence: 'working' },
    { who: 'ledger', name: 'Ledger', last: 'Gates 2 to 7 are green.', time: 'Mon', presence: 'idle' },
  ];
  const chatRow = (c, i) => `<li class="chat-row${c.unread ? ' unread' : ''}"${open && i === 0 ? ' aria-current="true"' : ''}>
      <span class="av ${c.who === 'boss' ? 'boss' : PROJECTS[c.who].c}">${c.who === 'boss' ? crown : PROJECTS[c.who].i}<span class="presence${c.presence === 'idle' ? ' idle' : ''}"></span></span>
      <span style="min-width:0;display:grid;gap:2px"><span class="name">${c.name}</span><span class="last">${c.mine ? use('check2', 'icon icon-sm') : ''}<span>${c.last}</span></span></span>
      <span class="side"><time>${c.time}</time>${c.unread ? `<span class="badge${c.q ? ' q' : ''}">${c.unread}</span>` : '<span style="height:20px"></span>'}</span></li>`;
  const listBar = `<div class="bar phone-only"><button class="ibtn" aria-label="Pages">${use('menu')}<span class="dot"></span></button><h1>Chats</h1><button class="ibtn" aria-label="New message">${use('pen')}</button></div>`;
  const listHead = `<div class="tools desktop-only" style="height:52px;padding-left:16px"><strong style="font-size:17px">Chats</strong><span class="spacer"></span><button class="ibtn" aria-label="New message">${use('pen')}</button></div>`;
  const tick = (s) => s === 'queued' ? `<span title="Queued">${use('clock')}</span>` : s === 'sent' ? `<span title="Delivered to the pane">${use('check')}</span>` : s === 'replied' ? `<span class="read" title="Replied">${use('check2')}</span>` : `<span title="Relayed by the Boss">${use('check2')}</span>`;
  const log = `
    <span class="day">Yesterday</span>
    <div class="group mine"><div class="b">Send the night report at 07:30, with the scorecard.<span class="meta">22:04 ${tick('replied')}</span></div></div>
    <div class="group">${av('boss', 's28')}<div class="b">Noted. The night watch starts at 00:30.<span class="meta">22:05</span></div></div>
    <span class="day">Today</span>
    <div class="group">${av('boss', 's28')}<a class="report-chip" href="?page=mail&open=1">${use('doc')}<span>Night report, 28–29 Sept<small>Report · open in Mailbox</small></span></a></div>
    <div class="unread-mark" role="separator">2 unread messages</div>
    <div class="group">${av('boss', 's28')}
      <div class="b"><div class="md"><p>Claude is at <strong>84%</strong> of its week. The reset is Thu 1 Oct 21:00.</p></div><span class="meta">07:40</span></div>
      <div class="b card"><div class="md"><p>The orchestrators use about 3% an hour. I hold new Claude workers until the reset. Say if you want a different trade-off.</p></div><span class="meta">07:41</span><div class="opts"><button class="primary">Approve</button><button class="deny">Reject</button><button>Later</button></div></div>
    </div>
    <div class="group mine"><div class="b">Keep the orchestrators on Claude.<span class="meta">07:44 ${tick('sent')}</span></div><div class="b">Codex takes the workers.<span class="meta">07:44 ${tick('queued')}</span></div></div>`;
  const thread = `
    <div class="bar"><button class="ibtn phone-only" aria-label="Back to chats">${use('back')}</button><span class="bar-title">${av('boss', 's32')}<span class="who"><strong>Boss</strong><small><span class="presence"></span>Working · pane boss</small></span></span><button class="ibtn" aria-label="Open in Mailbox">${use('inbox')}</button></div>
    <div class="stage" style="flex-direction:column"><div class="log" role="log" aria-label="Messages with the Boss">${log}</div>${q.get('scrolled') === '1' ? `<button class="jump" aria-label="Jump to the newest message, 2 new">${use('down')}<span class="badge">2</span></button>` : ''}</div>
    <form class="composer"><div class="field${kbd ? '' : ' empty'}">${kbd ? '<span>Hold them, and tell Atlas to finish the review pass first</span><span class="caret"></span>' : 'Message the Boss'}</div><button class="send" type="button" aria-label="Send"${kbd ? '' : ' disabled'}>${sendIcon}</button></form>`;
  document.body.classList.add('chat');
  document.getElementById('root').innerHTML = `<div class="shell">${globalBar('Chat')}
    <div class="stage"><div class="split${open ? ' open' : ''}" style="display:flex;flex:1;min-width:0">
      <section class="pane list" aria-label="Chats">${listBar}${listHead}<div class="scroll"><ul class="rows">${chats.map(chatRow).join('')}</ul></div></section>
      <section class="pane detail" aria-label="Conversation">${thread}</section>
    </div></div></div><div class="kbd">keyboard</div>`;
}
// A chat opens at the newest message, as in every reference app.
for (const log of document.querySelectorAll('.log')) log.scrollTop = q.get('scrolled') === '1' ? 0 : log.scrollHeight;
</script>
</body>
</html>
